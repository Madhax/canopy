[project]
name = "target-app"
version = "0.1.0"
description = "Expense-reports service — the MVP-1 software team's work object (docs/execution/target-app.md)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["acceptance: the QA-only review suite (red against the shipped app by design)"]
